<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador de Turnos Médicos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Librería SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <header>
    <h1>Simulador de Turnos Médicos</h1>
    <p>Seleccioná un profesional y reservá tu turno</p>
  </header>

  <main>

    <!-- FILTRO -->
    <section class="filtro">
      <label for="filtro">Filtrar por especialidad:</label>
      <select id="filtro">
        <option value="todos">Todos</option>
        <option value="Clinico">Clínico</option>
        <option value="Pediatria">Pediatría</option>
        <option value="Traumatologia">Traumatología</option>
      </select>
    </section>

    <!-- MÉDICOS -->
    <section>
      <h2>Médicos disponibles</h2>
      <div id="medicos" class="contenedor"></div>
    </section>

    <!-- TURNOS -->
    <section>
      <h2>Mis turnos</h2>
      <ul id="turnos"></ul>
    </section>

  </main>

  <footer>
    <p>Proyecto Final JavaScript</p>
  </footer>

  <!-- JS -->
  <script src="js/app.js"></script>
</body>
</html>
